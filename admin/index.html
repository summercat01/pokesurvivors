<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포켓몬 서바이버즈 — 어드민</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', 'Malgun Gothic', Arial, sans-serif; background: #0f1117; color: #e0e0e0; min-height: 100vh; }
  #auth-wall { display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; gap: 12px; }
  #auth-wall h1 { color: #ff4444; font-size: 20px; }
  #auth-wall p { color: #888; font-size: 14px; }
  #app { display: none; max-width: 900px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; color: #88ccff; margin-bottom: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }
  .tab { padding: 8px 16px; background: #1e2330; border: 1px solid #333; border-radius: 6px 6px 0 0; cursor: pointer; color: #888; font-size: 13px; transition: all 0.15s; }
  .tab.active { background: #1a2744; color: #88ccff; border-bottom-color: #1a2744; }
  .tab:hover:not(.active) { background: #252a38; color: #bbb; }
  .panel { background: #1a2030; border: 1px solid #2a3448; border-radius: 0 6px 6px 6px; padding: 16px; }
  .search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-bar input { flex: 1; padding: 8px 12px; background: #0f1117; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-size: 13px; }
  .search-bar button { padding: 8px 16px; background: #1e3a5f; border: 1px solid #2a5080; border-radius: 6px; color: #88ccff; cursor: pointer; font-size: 13px; }
  .search-bar button:hover { background: #254870; }
  .pagination { display: flex; align-items: center; gap: 6px; margin-top: 12px; justify-content: center; flex-wrap: wrap; }
  .pg-btn { padding: 5px 12px; background: #1e2a3a; border: 1px solid #2a3a50; border-radius: 5px; color: #88aacc; cursor: pointer; font-size: 12px; }
  .pg-btn:hover:not(:disabled) { background: #253545; }
  .pg-btn:disabled { opacity: 0.35; cursor: default; }
  .pg-btn.active { background: #1e3a5f; border-color: #2a5080; color: #88ccff; font-weight: bold; }
  .pg-info { color: #556; font-size: 12px; padding: 0 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; padding: 8px 10px; background: #0f1520; color: #6688aa; border-bottom: 1px solid #2a3448; white-space: nowrap; }
  td { padding: 8px 10px; border-bottom: 1px solid #1e2838; vertical-align: top; word-break: break-all; }
  tr:hover td { background: #1e2535; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; }
  .badge-red { background: #4a1a1a; color: #ff8888; }
  .badge-green { background: #1a3a1a; color: #88ff88; }
  .badge-gray { background: #2a2a2a; color: #888; }
  .badge-amber { background: #3a2a00; color: #ffaa44; }
  .btn { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; border: none; font-family: inherit; transition: opacity 0.15s; }
  .btn:hover { opacity: 0.8; }
  .btn-danger { background: #5a1a1a; color: #ffaaaa; }
  .btn-success { background: #1a4a1a; color: #aaffaa; }
  .btn-primary { background: #1a3a5a; color: #aaccff; }
  .btn-warn { background: #4a3a00; color: #ffcc88; }
  .empty { color: #444; font-size: 13px; padding: 24px 0; text-align: center; }
  .deleted { opacity: 0.45; }
  .content-cell { max-width: 280px; }
  .loading { color: #555; font-size: 13px; text-align: center; padding: 24px; }
  .toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 18px; border-radius: 8px; font-size: 13px; z-index: 9999; animation: fadeIn 0.2s; }
  .toast-ok { background: #1a4a1a; color: #aaffaa; border: 1px solid #2a7a2a; }
  .toast-err { background: #4a1a1a; color: #ffaaaa; border: 1px solid #7a2a2a; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .category-bug { color: #ff8888; }
  .category-update { color: #88aaff; }
  .category-other { color: #aaaaaa; }
  #report-count-badge { background: #4a1a1a; color: #ff8888; border-radius: 12px; padding: 1px 7px; font-size: 11px; margin-left: 4px; }
</style>
</head>
<body>

<div id="auth-wall">
  <h1>⛔ 접근 권한 없음</h1>
  <p>관리자 계정으로 게임에 로그인한 후 이 페이지를 열어주세요.</p>
</div>

<div id="app">
  <h1>🛡️ 포켓몬 서바이버즈 — 어드민 패널</h1>

  <div class="tabs">
    <div class="tab active" data-tab="reports">신고 관리 <span id="report-count-badge">-</span></div>
    <div class="tab" data-tab="inquiries">📩 문의함</div>
    <div class="tab" data-tab="users">👤 유저 관리</div>
  </div>

  <!-- 신고 관리 탭 -->
  <div id="tab-reports" class="panel">
    <div id="reports-content" class="loading">불러오는 중...</div>
  </div>

  <!-- 문의함 탭 -->
  <div id="tab-inquiries" class="panel" style="display:none">
    <div id="inquiries-content" class="loading">불러오는 중...</div>
  </div>

  <!-- 유저 관리 탭 -->
  <div id="tab-users" class="panel" style="display:none">
    <div class="search-bar">
      <input id="user-search" type="text" placeholder="아이디 또는 닉네임 검색">
      <button onclick="searchUsers()">검색</button>
      <button onclick="loadUsers('')">전체 보기</button>
    </div>
    <div id="users-content" class="loading">검색하거나 전체 보기를 클릭하세요.</div>
  </div>
</div>

<script>
const API = '/api';
let token = localStorage.getItem('pkmn_token');

function authHeaders() {
  return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(API + path, { headers: authHeaders(), ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function showToast(msg, isErr = false) {
  const el = document.createElement('div');
  el.className = `toast ${isErr ? 'toast-err' : 'toast-ok'}`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

function esc(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function timeAgo(dateStr) {
  const d = new Date(dateStr);
  const diff = Math.floor((Date.now() - d.getTime()) / 1000);
  if (diff < 60) return `${diff}초 전`;
  if (diff < 3600) return `${Math.floor(diff/60)}분 전`;
  if (diff < 86400) return `${Math.floor(diff/3600)}시간 전`;
  return d.toLocaleDateString('ko-KR');
}

// ── 탭 전환 ─────────────────────────────────────────
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
    tab.classList.add('active');
    const name = tab.dataset.tab;
    document.getElementById(`tab-${name}`).style.display = 'block';
    if (name === 'reports') loadReports();
    else if (name === 'inquiries') loadInquiries();
  });
});

// ── 신고 관리 ────────────────────────────────────────
async function loadReports() {
  const el = document.getElementById('reports-content');
  el.innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const posts = await apiFetch('/admin/community');
    const reported = posts.filter(p => p.report_count > 0 || !p.deleted_at);

    // 신고수 배지 업데이트
    const unreviewedCount = posts.filter(p => p.report_count > 0 && !p.deleted_at).length;
    document.getElementById('report-count-badge').textContent = unreviewedCount || '✓';

    if (posts.length === 0) {
      el.innerHTML = '<div class="empty">글이 없습니다.</div>';
      return;
    }

    el.innerHTML = `
      <table>
        <thead>
          <tr>
            <th style="width:36px">ID</th>
            <th style="width:80px">작성자</th>
            <th>내용</th>
            <th style="width:60px">신고수</th>
            <th style="width:80px">작성일</th>
            <th style="width:60px">상태</th>
            <th style="width:120px">액션</th>
          </tr>
        </thead>
        <tbody id="reports-tbody"></tbody>
      </table>
    `;

    const tbody = document.getElementById('reports-tbody');
    for (const p of posts) {
      const isDeleted = !!p.deleted_at;
      const tr = document.createElement('tr');
      if (isDeleted) tr.className = 'deleted';
      tr.innerHTML = `
        <td>${p.id}</td>
        <td title="${esc(p.user_id)}">${esc(p.nickname)}</td>
        <td class="content-cell">${esc(p.content)}</td>
        <td>
          ${p.report_count > 0
            ? `<span class="badge badge-red">🚨 ${p.report_count}</span>`
            : `<span class="badge badge-gray">0</span>`}
        </td>
        <td>${timeAgo(p.created_at)}</td>
        <td>
          ${isDeleted
            ? `<span class="badge badge-gray">삭제됨<br><small>${esc(p.deleted_by)}</small></span>`
            : `<span class="badge badge-green">활성</span>`}
        </td>
        <td>
          ${!isDeleted ? `<button class="btn btn-danger" onclick="deletePost(${p.id})">삭제</button> ` : ''}
          <button class="btn btn-warn" onclick="banUser('${esc(p.user_id)}', '${esc(p.nickname)}')">밴</button>
          <button class="btn btn-success" onclick="unbanUser('${esc(p.user_id)}', '${esc(p.nickname)}')">밴해제</button>
        </td>
      `;
      tbody.appendChild(tr);
    }
  } catch (err) {
    el.innerHTML = `<div class="empty">오류: ${esc(err.message)}</div>`;
  }
}

async function deletePost(id) {
  if (!confirm(`글 #${id}을 삭제하시겠습니까?`)) return;
  try {
    await apiFetch(`/admin/community/${id}`, { method: 'DELETE' });
    showToast('삭제되었습니다');
    loadReports();
  } catch (err) {
    showToast(err.message, true);
  }
}

// ── 문의함 ────────────────────────────────────────────
async function loadInquiries() {
  const el = document.getElementById('inquiries-content');
  el.innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const items = await apiFetch('/admin/inquiries');
    if (items.length === 0) {
      el.innerHTML = '<div class="empty">문의가 없습니다.</div>';
      return;
    }

    const catLabel = { bug: '🐛 버그', update: '💡 업데이트', other: '💬 기타' };
    const catClass = { bug: 'category-bug', update: 'category-update', other: 'category-other' };

    el.innerHTML = `
      <table>
        <thead>
          <tr>
            <th style="width:36px">ID</th>
            <th style="width:80px">닉네임</th>
            <th style="width:80px">카테고리</th>
            <th>내용</th>
            <th style="width:80px">접수일</th>
          </tr>
        </thead>
        <tbody id="inquiries-tbody"></tbody>
      </table>
    `;

    const tbody = document.getElementById('inquiries-tbody');
    for (const item of items) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${item.id}</td>
        <td>${esc(item.nickname)}</td>
        <td class="${catClass[item.category] || ''}">${catLabel[item.category] || esc(item.category)}</td>
        <td class="content-cell">${esc(item.content)}</td>
        <td>${timeAgo(item.created_at)}</td>
      `;
      tbody.appendChild(tr);
    }
  } catch (err) {
    el.innerHTML = `<div class="empty">오류: ${esc(err.message)}</div>`;
  }
}

// ── 유저 관리 ─────────────────────────────────────────
let userCurrentPage = 1;
let userCurrentQ    = '';

async function searchUsers() {
  userCurrentQ    = document.getElementById('user-search').value.trim();
  userCurrentPage = 1;
  loadUsers(userCurrentQ, userCurrentPage);
}

document.getElementById('user-search').addEventListener('keydown', e => {
  if (e.key === 'Enter') searchUsers();
});

async function loadUsers(q, page = 1) {
  userCurrentQ    = q;
  userCurrentPage = page;
  const el = document.getElementById('users-content');
  el.innerHTML = '<div class="loading">불러오는 중...</div>';
  try {
    const limit = 20;
    const data  = await apiFetch(`/admin/users?q=${encodeURIComponent(q)}&page=${page}&limit=${limit}`);
    const { users, total } = data;
    const totalPages = Math.max(1, Math.ceil(total / limit));

    if (users.length === 0) {
      el.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
      return;
    }

    el.innerHTML = `
      <table>
        <thead>
          <tr>
            <th style="width:80px">아이디</th>
            <th style="width:80px">닉네임</th>
            <th style="width:60px">권한</th>
            <th style="width:80px">상태</th>
            <th style="width:80px">가입일</th>
            <th style="width:140px">액션</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <div id="users-pagination" class="pagination"></div>
    `;

    const tbody = document.getElementById('users-tbody');
    for (const u of users) {
      const isBanned = !!u.banned_at;
      const tr = document.createElement('tr');
      if (isBanned) tr.className = 'deleted';
      tr.innerHTML = `
        <td>${esc(u.username)}</td>
        <td>${esc(u.nickname)}</td>
        <td>${u.is_admin ? '<span class="badge badge-amber">관리자</span>' : '<span class="badge badge-gray">일반</span>'}</td>
        <td>${isBanned
          ? '<span class="badge badge-red">밴됨</span>'
          : '<span class="badge badge-green">정상</span>'}
        </td>
        <td>${new Date(u.created_at).toLocaleDateString('ko-KR')}</td>
        <td>
          ${!isBanned
            ? `<button class="btn btn-danger" onclick="banUser('${esc(u.id)}', '${esc(u.nickname)}')">밴</button> `
            : `<button class="btn btn-success" onclick="unbanUser('${esc(u.id)}', '${esc(u.nickname)}')">밴해제</button> `}
        </td>
      `;
      tbody.appendChild(tr);
    }

    renderPagination('users-pagination', page, totalPages, p => loadUsers(userCurrentQ, p));
  } catch (err) {
    el.innerHTML = `<div class="empty">오류: ${esc(err.message)}</div>`;
  }
}

async function banUser(userId, nickname) {
  if (!confirm(`"${nickname}"을(를) 밴하시겠습니까?\n이 유저는 로그인 및 글 작성이 불가능해집니다.`)) return;
  try {
    await apiFetch(`/admin/ban/${userId}`, { method: 'POST' });
    showToast(`${nickname} 밴 완료`);
    // 현재 활성 탭 기준으로 새로고침
    const activeTab = document.querySelector('.tab.active')?.dataset.tab;
    if (activeTab === 'users') loadUsers(userCurrentQ, userCurrentPage);
    else loadReports();
  } catch (err) {
    showToast(err.message, true);
  }
}

async function unbanUser(userId, nickname) {
  if (!confirm(`"${nickname}"의 밴을 해제하시겠습니까?`)) return;
  try {
    await apiFetch(`/admin/unban/${userId}`, { method: 'POST' });
    showToast(`${nickname} 밴 해제 완료`);
    const activeTab = document.querySelector('.tab.active')?.dataset.tab;
    if (activeTab === 'users') loadUsers(userCurrentQ, userCurrentPage);
    else loadReports();
  } catch (err) {
    showToast(err.message, true);
  }
}

// ── 공통 페이지네이션 렌더 ────────────────────────────
function renderPagination(containerId, currentPage, totalPages, onPage) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';

  const mkBtn = (label, page, disabled = false, active = false) => {
    const b = document.createElement('button');
    b.className = 'pg-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.disabled = disabled;
    if (!disabled) b.addEventListener('click', () => onPage(page));
    el.appendChild(b);
  };

  mkBtn('◀ 이전', currentPage - 1, currentPage <= 1);

  // 현재 페이지 주변 5개 버튼
  const start = Math.max(1, currentPage - 2);
  const end   = Math.min(totalPages, start + 4);
  for (let p = start; p <= end; p++) {
    mkBtn(String(p), p, false, p === currentPage);
  }

  mkBtn('다음 ▶', currentPage + 1, currentPage >= totalPages);

  const info = document.createElement('span');
  info.className = 'pg-info';
  info.textContent = `${currentPage} / ${totalPages} 페이지`;
  el.appendChild(info);
}

// ── 초기화: 어드민 권한 확인 ─────────────────────────
async function init() {
  if (!token) {
    return; // auth-wall 표시
  }
  try {
    await apiFetch('/admin/verify');
    document.getElementById('auth-wall').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadReports();
  } catch {
    // auth-wall 유지
  }
}

init();
</script>
</body>
</html>
